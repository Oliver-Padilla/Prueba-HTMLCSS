<!--FORMULARIO DE CAPTURA-->
<!--MODULO 2. DESARROLLO DE PÁGINAS WEB-->
<!--OLIVER JOSUE PADILLA QUINTANILLA-->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="contenedor">
            <h1>Formulario de captura</h1>
            <form class="formulario-encuesta">
                <!--DATOS PERSONALES-->
                <fieldset>
                    <legend>Datos Personales</legend>
                    <div class="grupo-campo">
                        <label for="nombre">Nombre de pila:</label>
                        <input type="text" id="nombre" name="nombre" required />
                    </div>
                    <div class="grupo-campo">
                        <label for="apellido-paterno">Apellido paterno:</label>
                        <input type="text" id="apellido-paterno" name="apellido-paterno" required />
                    </div>
                    <div class="grupo-campo">
                        <label for="apellido-materno">Apellido materno:</label>
                        <input type="text" id="apellido-materno" name="apellido-materno" required />
                    </div>
                    <div class="grupo-campo">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" required />
                    </div>
                    <div class="grupo-campo">
                        <label for="genero">Género:</label>
                        <label><input type="radio" name="genero" value="Masculino" required />Masculino</label>
                        <label><input type="radio" name="genero" value="Femenino" />Femenino</label>
                        <label><input type="radio" name="genero" value="Otro" />Otro</label>
                    </div>
                </fieldset>

                <!--PREGUNTAS DE SELECCIÓN -->
                <fieldset>
                    <legend>Preguntas de selección</legend>
                    <div class="grupo-campo">
                        <p>¿Cuál es tu sistema operativo favorito?</p>
                        <label> <input type="radio" name="os" value="windows" required /> Windows </label>
                        <label> <input type="radio" name="os" value="macos" /> MacOS </label>
                        <label> <input type="radio" name="os" value="linux" /> Linux </label>
                    </div>
                    <div class="grupo-casillas">
                        <p>¿Qué tecnología utilizas? (Selecciona todas las que correspondan)</p>
                        <label> <input type="checkbox" name="tech" value="html" /> HTML </label>
                        <label> <input type="checkbox" name="tech" value="css" /> CSS </label>
                        <label> <input type="checkbox" name="tech" value="javascript" /> JavaScript </label>
                    </div>
                </fieldset>

                <!--SECCIÓN DE COMENTARIOS-->
                <fieldset>
                    <legend>Comentarios Finales</legend>
                    <div class="grupo-campo">
                        <label for="comments"> Escribe tus comentarios:</label>
                        <textarea id="comments" name="comments" rows="5"></textarea>
                    </div>
                </fieldset>

                <!--BOTÓN DE ENVÍO-->
                <div class="grupo-campo">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
    </body>
</html>
